[project]
name = "swarm"
version = "0.1.0"
description = "Assay: a funded agent swarm that reviews DAO grant proposals"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
]

[project.scripts]
swarm = "swarm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
